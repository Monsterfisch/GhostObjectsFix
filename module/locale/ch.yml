enabled: 修复地块物体列表
enabled_tooltip: 游戏为每个地块维护一份小型物体列表（旗帜、投射物、尘土、烟雾、飞鸟），并在对应地块上绘制。有时物体已被删除却仍残留在地块列表中，下一个复用该槽位的物体（旗帜、石块、箭矢等）就会同时在旧地块上显示并常常闪烁。本选项会依据每个物体的真实位置重建所有地块的列表。使用此修复前，请先关闭 Improved Siege Engines 中的滚油瞄准与滚油蔓延选项。
interval: 每隔多少次物体更新执行一次修复
interval_tooltip: 列表重建的频率，以游戏的物体更新次数计（每秒数次）。1 表示每次更新都重建。重建速度很快；数值越小，残影物体清除得越快。
bugfixes: 错误修复
tags.bugfixes: 错误修复
