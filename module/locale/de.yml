enabled: Objektlisten reparieren
enabled_tooltip: Das Spiel führt für jedes Feld eine Liste kleiner Objekte (Flaggen, Geschosse, Staub, Rauch, Vögel) und zeichnet jede Liste auf ihrem Feld. Manchmal wird ein Objekt gelöscht, während es noch in der Liste eines Feldes steht. Das nächste Objekt, das seinen Platz einnimmt (eine Flagge, ein Stein, ein Pfeil ...), wird dann ebenfalls auf diesem alten Feld gezeichnet und flackert oft. Diese Option baut die Liste jedes Feldes anhand der tatsächlichen Position jedes Objekts neu auf.
interval: Alle so viele Objektaktualisierungen reparieren
interval_tooltip: Wie oft die Listen neu aufgebaut werden, gezählt in Objektaktualisierungen des Spiels (mehrere pro Sekunde). 1 = bei jeder Aktualisierung. Der Neuaufbau ist schnell; kleinere Werte entfernen Geisterobjekte schneller.
bugfixes: Fehlerkorrekturen
tags.bugfixes: Fehlerkorrekturen
