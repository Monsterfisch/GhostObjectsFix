enabled: Reparar listas de objetos
enabled_tooltip: El juego guarda una lista de los objetos pequeños en cada casilla (banderas, proyectiles, polvo, humo, pájaros) y dibuja cada lista en su casilla. A veces un objeto se elimina mientras sigue en la lista de una casilla, y el siguiente objeto que ocupa su lugar (una bandera, una piedra, una flecha...) también se dibuja en esa vieja casilla, a menudo parpadeando. Esta opción reconstruye la lista de cada casilla según la posición real de cada objeto. Desactiva las opciones de apuntado y expansión de aceite de Improved Siege Engines antes de usar esta corrección.
interval: Reparar cada tantas actualizaciones de objetos
interval_tooltip: Con qué frecuencia se reconstruyen las listas, contada en actualizaciones de objetos del juego (varias por segundo). 1 = en cada actualización. La reconstrucción es rápida; valores más bajos eliminan antes los objetos fantasma.
