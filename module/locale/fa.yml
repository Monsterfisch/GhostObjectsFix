enabled: بازسازی فهرست اشیاء خانه‌ها
enabled_tooltip: بازی فهرستی از اشیاء کوچک روی هر خانه (پرچم‌ها، پرتابه‌ها، گردوغبار، دود، پرندگان) نگه می‌دارد و هر فهرست را روی همان خانه رسم می‌کند. گاهی شیئی حذف می‌شود در حالی که هنوز در فهرست یک خانه مانده است؛ در نتیجه شیء بعدی که جای آن را می‌گیرد (پرچم، سنگ، تیر...) روی آن خانهٔ قدیمی نیز رسم می‌شود و اغلب چشمک می‌زند. این گزینه فهرست هر خانه را بر پایهٔ جایگاه واقعی هر شیء بازسازی می‌کند.
interval: بازسازی پس از هر چند به‌روزرسانی اشیاء
interval_tooltip: تعداد دفعات بازسازی فهرست‌ها بر حسب به‌روزرسانی اشیاء بازی (چند بار در ثانیه). مقدار 1 یعنی در هر به‌روزرسانی. بازسازی سریع است و مقادیر کمتر اشیاء شبح را زودتر پاک می‌کنند.
