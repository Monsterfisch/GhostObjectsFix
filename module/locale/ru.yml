enabled: Исправлять списки объектов
enabled_tooltip: Игра хранит список мелких объектов на каждой клетке (флаги, снаряды, пыль, дым, птицы) и отрисовывает каждый список на своей клетке. Иногда объект удаляется, оставаясь в списке клетки, и следующий объект на его месте (флаг, камень, стрела...) тоже начинает отображаться на той старой клетке, часто мерцая. Эта опция заново собирает список каждой клетки по реальным позициям объектов.
interval: Исправлять через каждые столько обновлений объектов
interval_tooltip: Как часто пересобираются списки, в обновлениях объектов игры (несколько в секунду). 1 = каждое обновление. Пересборка быстрая; меньшие значения быстрее убирают призрачные объекты.
bugfixes: Исправления
